<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plethora.ai</title>
<style>
:root{color-scheme:dark;--bg:#0C0D0F;--ink:#D8DBE0;--hi:#F4F5F7;--mute:#7B808A;--line:#24272D;--acc:#D8DBE0}
*{box-sizing:border-box}
html{background:var(--bg)}
/* soft gray aura in the middle of the screen that slowly breathes */
html::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 46%,rgba(150,156,168,.2),rgba(150,156,168,.07) 30%,transparent 58%);animation:aura 9s ease-in-out infinite}
@keyframes aura{50%{opacity:.65;transform:scale(1.07)}}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
background:radial-gradient(ellipse 80% 45% at 50% -6%,rgba(125,145,190,.14),transparent 70%),var(--bg);background-attachment:fixed}
/* film grain and vignette, like a dim room lit by a screen */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.6))}
header,main{position:relative;z-index:1}
header{max-width:520px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:baseline}
header b{font-weight:400;letter-spacing:.04em;color:var(--hi)}
main{max-width:520px;margin:0 auto;padding:56px 20px 72px;counter-reset:n}
main>*{animation:f .38s cubic-bezier(.2,.7,.2,1) both}
main>:nth-child(2){animation-delay:.05s}main>:nth-child(3){animation-delay:.1s}main>:nth-child(4){animation-delay:.15s}
main>:nth-child(5){animation-delay:.2s}main>:nth-child(6){animation-delay:.25s}main>:nth-child(7){animation-delay:.3s}main>:nth-child(8){animation-delay:.35s}
@keyframes f{from{opacity:0;transform:translateY(8px)}}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){main>*,h1::after,html::before{animation:none!important}}
h1{font-size:22px;line-height:1.35;font-weight:500;letter-spacing:-.01em;color:var(--hi);margin:0 0 30px}
h1::after{content:"_";margin-left:4px;color:var(--mute);animation:b 1.1s steps(1) infinite}
button{font:inherit;cursor:pointer;transition:background .16s,border-color .16s,box-shadow .2s,transform .12s,color .16s}
button:active{transform:scale(.985)}
.opt,.main{display:block;width:100%;min-height:56px;margin:0 0 10px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#000;color:var(--ink);text-align:left}
.opt::before{content:"›";display:inline-block;width:1.4em;opacity:0;color:var(--mute);transition:opacity .16s}
.opt:hover,.main:hover,.small:hover{border-color:#454A52;box-shadow:0 0 0 1px rgba(200,210,235,.05),0 10px 34px rgba(120,140,190,.09)}
.opt:hover::before{opacity:1}
.main{text-align:center;border-color:#363A41;color:var(--hi)}
.opt.on{background:var(--acc);border-color:var(--acc);color:#000}
.opt.on::before{opacity:1;color:#000}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#000;border:1px solid var(--line);border-radius:10px;transition:border-color .16s,box-shadow .2s}
input,textarea{padding:14px 16px;margin:0 0 10px}
input{min-height:56px}
input::placeholder,textarea::placeholder{color:#5A5F68}
input:focus,textarea:focus,select:focus{outline:none;border-color:#5B616B;box-shadow:0 0 0 1px rgba(200,210,235,.08),0 0 28px rgba(120,140,190,.12)}
textarea{resize:vertical;font-size:14px;padding:10px 12px;margin:6px 0 0}
select{min-height:56px;padding:0 12px}
.fld{display:block;margin:0 0 16px;color:var(--mute);font-size:13px}
.fld input,.fld select{margin:6px 0 0}
.fld+.main{margin-top:8px}
.more{display:block;margin:30px 0 0;font-size:13px;color:var(--mute)}
.link{background:none;border:0;padding:0;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--hi)}
main>.link{display:block;margin-top:26px}
.note{color:var(--mute);font-size:13px;margin:0 0 22px}
article{margin:0 0 12px;padding:18px 18px 14px;border:1px solid #1D2025;border-radius:12px;background:rgba(255,255,255,.025);counter-increment:n}
article::before{content:"0" counter(n);display:block;color:var(--mute);font-size:12px;letter-spacing:.12em;margin-bottom:6px}
article h2{font-size:18px;margin:0 0 4px;font-weight:500;color:var(--hi)}
article p{margin:0 0 14px;color:var(--ink)}
.small{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#000;color:var(--ink);font-size:13px;margin-right:8px}
.st{margin-top:14px}
.st ol{margin:0 0 8px;padding-left:20px}
a{color:var(--hi);text-underline-offset:3px}
:focus-visible{outline:1px solid #8A909A;outline-offset:3px}
</style>
</head>
<body>
<header><b>Plethora.ai</b><button id="sv" class="link"></button></header>
<main id="m"></main>
<script>
// ---------- SAMPLE DATA: REPLACE WITH AI LATER ----------
// Each item: [title, description, "step 1|step 2|step 3", optional filter tag]
const D={
"Arts":[
["Draw your hands","A 20-minute warm-up sketch with any pen.","Pick a pen and paper|Draw your non-dominant hand without looking at the page|Redraw it slowly, looking this time"],
["Blind contour portrait","Draw a face without lifting the pen.","Set a 10-minute timer|Keep the pen on the paper the whole time|Compare it with a normal sketch"],
["Color mixing chart","Mix a grid of colors from three paints or pencils.","Choose three base colors|Mix each pair in equal parts|Label the results"],
["One-line drawing","Draw an object in a single unbroken line.","Pick an object on your desk|Draw it without lifting the pen|Try again, faster"]],
"Crafts":[
["Origami crane","A classic fold that takes about 15 minutes.","Cut a square sheet of paper|Follow a crane diagram from a beginner origami site|Shape the wings and neck"],
["Friendship bracelet","A braided bracelet from three strands of thread.","Cut three 40 cm strands|Knot them at the top and tape down|Braid until it fits, then knot"],
["Paper bookmark","Decorate a bookmark from scrap paper.","Cut a 5 by 15 cm strip|Decorate one side|Punch a hole and add a string tassel"],
["Can pencil holder","Reuse a clean can as a desk organizer.","Wash and dry the can|Wrap it in paper or fabric|Glue the edges and let it dry"],
["Paper airplane test flights","Fold three designs and see which flies farthest.","Fold three different paper airplanes|Fly each from the same spot|Keep the one that goes farthest"],
["Sticky note doodles","Turn a pad of sticky notes into tiny drawings.","Grab a pen and a sticky note pad|Draw one small thing per note|Stick them in a grid on a wall"]],
"Cooking":[
["Fried rice","Use cold rice and any vegetables you have.","Heat oil in a pan|Fry vegetables for 3 minutes|Add cold rice and soy sauce, stir for 5 minutes"],
["Quesadilla","Ready in 10 minutes with a tortilla and cheese.","Put cheese on half a tortilla|Fold and cook 2 minutes per side|Slice and serve"],
["Veggie omelet","A fast meal with eggs and vegetables.","Whisk two eggs|Cook in a buttered pan|Add chopped vegetables, fold, and serve"],
["Peanut noodles","Noodles with a quick sauce.","Boil noodles as the package says|Mix peanut butter, soy sauce, and hot water|Toss together"]],
"Baking":[
["Mug cake","A single-serving cake made in the microwave.","Mix flour, sugar, cocoa, and milk in a mug|Microwave for 90 seconds|Let it cool for a minute"],
["Cookies for two","A small batch of chocolate chip cookies.","Mix butter, sugar, flour, and chips|Scoop four balls onto a tray|Bake at 175 C (350 F) for 10 minutes"],
["Banana muffins","A use for overripe bananas.","Mash two bananas|Mix with flour, sugar, egg, and butter|Bake in a muffin tin for 20 minutes"],
["Yogurt flatbread","Two-ingredient dough, no oven.","Mix equal parts flour and yogurt|Roll into thin rounds|Cook in a dry pan 2 minutes per side"]],
"Outdoors":[
["Photo walk","A 30-minute walk photographing one theme.","Pick a theme like doors or shadows|Walk without a destination|Choose your best three photos"],
["Find five new things","Look for details you have missed.","Walk a familiar route|Notice five things you have not seen before|Write them down"],
["Sit and sketch","Pick a spot and draw what you see.","Find a bench or a lawn|Draw for 15 minutes|Add the date to the page"],
["Cloud watching","Lie down and watch the sky for 10 minutes.","Find a safe place to lie down|Look for shapes in the clouds|Notice how they change"]],
"Music":[
["Song Maker loop","Build an 8-bar melody in Chrome Music Lab.","Open Chrome Music Lab and choose Song Maker|Click to place notes|Press play and adjust","Create"],
["Build a beat","Use the Rhythm tool in Chrome Music Lab.","Open Chrome Music Lab and choose Rhythm|Place beats on the grid|Add a second sound","Create"],
["Melody Maker","Make a short tune with Chrome Music Lab.","Open Chrome Music Lab and choose Melody Maker|Draw a melody|Change the instrument and replay","Create"],
["Listen to a full album","Pick an album you have never heard.","Pick an album|Put your phone away|Write one line about each track","Listen"],
["Mood playlist","Collect ten songs for how you feel now.","Pick a mood|Add ten songs|Order them from start to end","Listen"],
["Try a new genre","Spend 20 minutes in a genre you do not know.","Pick a genre you have skipped|Find a well-known playlist|Note one song you liked","Listen"]],
"Books/Shows":[
["Read one short story","Finish a story in one sitting.","Choose a short story from a library or free site|Read without checking your phone|Write one sentence about the ending","Book"],
["Open a book you own","Read the first 30 pages of an unread book.","Pick one from your shelf|Read 30 pages|Decide whether to keep going","Book"],
["Borrow an ebook","Use a library app to get your next read.","Open your library app|Search your genre|Borrow it and read chapter one","Book"],
["One new episode","Commit to a single episode of something new.","Open one of your services|Search by your genre|Watch one full episode","Show"],
["Short documentary","A film under 40 minutes.","Search for short documentaries|Pick one|Watch without scrolling","Show"],
["Foreign-language film","Try a film with subtitles.","Pick a country you know little about|Find a film with subtitles|Watch the first 20 minutes","Show"]],
"Coding":[
["Number guessing game","A small first program.","Pick your language|Make the computer choose a number from 1 to 100|Loop until the player guesses it"],
["Reverse a string","A classic warm-up exercise.","Write a function that takes text|Return it backwards|Test with three examples"],
["Terminal to-do list","A tiny project to practice lists.","Store tasks in a list|Add a menu to add and remove tasks|Print the list after each action"],
["One practice problem","Try one problem from a free coding site.","Pick the easiest level|Write the solution in plain words first|Code it and test"]],
"Learn something random":[
["Random Wikipedia article","Learn something you did not pick.","Open Wikipedia's random article|Read the whole thing|Tell someone one fact"],
["Five words in a new language","Pick a language and learn the basics.","Pick a language|Find five common words|Say each one out loud"],
["How does it work?","Pick an object near you and find out.","Choose an object|Search how it works|Explain it in three sentences"],
["Short explainer video","A video under 10 minutes on a new topic.","Search a topic you know nothing about|Pick a video under 10 minutes|Write down one new thing"]],
"Social":[
["Card game night","A simple card game for the group.","Pick a game like Rummy or Spoons|Deal the cards|Play three rounds"],
["Cook together","Make one simple meal as a group.","Pick a recipe with few ingredients|Split the steps|Eat together"],
["Two truths and a lie","Works with any group size.","Each person says three statements|Others guess the lie|Take turns"],
["Walk and talk","A group walk with one question each.","Choose a route|Each person asks one question|Swap partners halfway"]]
};
const NICHES=Object.keys(D);
const LV=["Beginner","Intermediate","Advanced"];
const has=(...n)=>a=>n.includes(a.niche);

// ---------- QUESTIONS: add a screen by adding one line ----------
// k = answer name, q = question, o = button options, ph = typed input hint, w = when to show, opt = optional
const BUDGET={k:"budget",l:"Budget",o:["Free only","Small budget","No limit"]};
const Q=[
{k:"tm",q:"",f:[{k:"time",l:"How much time do you have?",ph:"e.g. 45 minutes"},{k:"mood",l:"How are you feeling?",o:["Stressed","Tired","Restless","Curious","Lonely","Energetic"]}]},
{k:"niche",q:"What are you in the mood for?",o:[...NICHES,"Surprise me"]},
{k:"d1",q:"What do you have to work with?",w:has("Arts","Crafts"),f:[{k:"materials",l:"Materials",ph:"e.g. pencils, paper, tape"},BUDGET]},
{k:"d2",q:"What’s in your kitchen?",w:has("Cooking","Baking"),f:[{k:"ingredients",l:"Ingredients",ph:"e.g. eggs, flour, rice"},{k:"allergies",l:"Allergies or restrictions",ph:"e.g. nuts, dairy",opt:1},BUDGET]},
{k:"people",q:"How many people?",ph:"e.g. 4",w:has("Social")},
{k:"weather",q:"What’s the weather like?",o:["Sunny","Cloudy","Rainy","Cold","Hot"],w:has("Outdoors")},
{k:"mlc",q:"Listen or create?",o:["Listen","Create"],w:has("Music")},
{k:"mgenre",q:"What genre?",ph:"e.g. jazz",w:a=>a.niche=="Music"&&a.mlc=="Listen"},
{k:"mlevel",q:"What is your music level?",o:LV,w:a=>a.niche=="Music"&&a.mlc=="Create"},
{k:"btype",q:"Book or show?",o:["Book","Show"],w:has("Books/Shows")},
{k:"d3",q:"What do you have access to?",w:has("Books/Shows"),f:[{k:"services",l:"Streaming, book, or library services",ph:"e.g. Netflix, library app"},{k:"region",l:"Country or region (changes what is available)",ph:"e.g. United States"},{k:"bgenre",l:"Genre",ph:"e.g. mystery"},{k:"blang",l:"Language",ph:"e.g. English"},BUDGET]},
{k:"d4",q:"Tell us about your coding.",w:has("Coding"),f:[{k:"clevel",l:"Level",o:LV},{k:"cexp",l:"Have you coded before?",o:["Yes","No"],w:a=>a.clevel=="Beginner"},{k:"clang",l:"Language",ph:"e.g. Python"}]}
];
// A question with only typed input becomes a one-field page automatically
Q.forEach(q=>{if(!q.o&&!q.f)q.f=[{k:q.k,ph:q.ph}]});

// ---------- APP ----------
const m=document.getElementById("m"),sv=document.getElementById("sv");
let a={},hist=[],cur=-1,pg=0,S=[];
try{S=JSON.parse(localStorage.getItem("plethora-saved")||"[]")}catch(e){}
const put=()=>{try{localStorage.setItem("plethora-saved",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nxt=i=>{for(let j=i+1;j<Q.length;j++)if(!Q[j].w||Q[j].w(a))return j;return"r"};
const more=()=>{const t=document.getElementById("mo");if(t&&Q[cur])a["more_"+Q[cur].k]=t.value};
const go=x=>{more();hist.push(cur);cur=x;if(x=="r"){pg=0;seen=[];AI=null;if(API_URL)fetchAI()}draw()};
const back=()=>{collect();more();if(hist.length){cur=hist.pop();draw()}};

function question(){
  const q=Q[cur];
  let h=q.q?"<h1>"+q.q+"</h1>":"";
  if(q.o)h+=q.o.map(o=>`<button class="opt${a[q.k]==o?" on":""}" data-a="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("");
  else{
    const fs=q.f.filter(f=>!f.w||f.w(a)),many=fs.length>1;
    h+=fs.map(f=>`<label class="fld">${many?f.l+(f.opt?" (optional)":""):""}${f.o?`<select data-k="${f.k}"><option value="">Choose one</option>${f.o.map(o=>`<option${a[f.k]==o?" selected":""}>${o}</option>`).join("")}</select>`:`<input data-k="${f.k}" value="${esc(a[f.k]||"")}" placeholder="${f.ph||""}" autocomplete="off">`}</label>`).join("");
    h+=`<button class="main" data-a="next">Next</button><p id="er" class="note"></p>`;
  }
  h+=`<label class="more">More info (optional)<textarea id="mo" rows="2">${esc(a["more_"+q.k]||"")}</textarea></label><button class="link" data-a="back">Back</button>`;
  return h;
}

const gs=t=>"https://www.google.com/search?q="+encodeURIComponent(t);
const MLB="https://musiclab.chromeexperiments.com/";
const LK={"Song Maker loop":MLB+"Song-Maker/","Build a beat":MLB+"Rhythm/","Melody Maker":MLB+"Melody-Maker/","Random Wikipedia article":"https://en.wikipedia.org/wiki/Special:Random"};

// Books/Shows picks are built from the user's answers. The real AI step will name exact titles with direct links.
function mine(){
  const g=a.bgenre||"any genre",sv=a.services||"your services",rg=a.region||"your region",lg=a.blang||"English";
  if(a.btype=="Show"){
    const st=["Use the link to see what is on "+sv+" in "+rg,"Pick the top result","Watch the first episode or first 20 minutes"].join("|");
    return [
      ["Top-rated "+g+" series","Start with episode one.",st,0,gs("best "+g+" series on "+sv+" "+rg)],
      ["A "+g+" movie under 100 minutes","Fits one sitting.",st,0,gs("best short "+g+" movies on "+sv+" "+rg)],
      ["A "+g+" miniseries","Finish it in a few sittings.",st,0,gs("best "+g+" miniseries "+sv+" "+rg)],
      ["A "+g+" documentary","True stories in the same genre.",st,0,gs("best "+g+" documentaries on "+sv+" "+rg)],
      ["A "+g+" show in "+lg,"Subtitles optional.",st,0,gs("best "+g+" shows in "+lg+" on "+sv+" "+rg)],
      ["Critics’ favorite "+g+" show","Highly rated and easy to start.",st,0,gs("critically acclaimed "+g+" tv shows "+sv+" "+rg)]];
  }
  const st=["Use the link to find it on "+sv,"Borrow or open the top result","Read the first chapter"].join("|");
  return [
    ["Top-rated "+g+" book","Borrow it free if your library has it.",st,0,gs("best "+g+" books "+lg)],
    ["A short "+g+" novel","Under 250 pages.",st,0,gs("short "+g+" novels under 250 pages")],
    ["A "+g+" short story collection","Easy to read in pieces.",st,0,gs("best "+g+" short story collections")],
    ["A "+g+" audiobook","Listen while you do something else.",st,0,gs("best "+g+" audiobooks "+lg)],
    ["A classic "+g+" book","Widely loved.",st,0,gs("classic "+g+" books")],
    ["A new "+g+" release","Published in the last year.",st,0,gs("new "+g+" books 2026")]];
}

// "More info" notes, tied to the question they were typed under
const STOP="that this with have just want like would some about from your they them what when then than into over also very more less".split(" ");
function notes(){return Q.filter(q=>(!q.w||q.w(a))&&(a["more_"+q.k]||"").trim()).map(q=>({question:q.q||"time and mood",note:a["more_"+q.k].trim()}))}
function noteWords(){return [...new Set(notes().map(n=>n.note.toLowerCase()).join(" ").split(/[^a-z]+/).filter(w=>w.length>3&&!STOP.includes(w)).map(w=>w.length>4?w.replace(/s$/,""):w))]}
// Sample version only: ideas that mention words from the notes move to the top. The AI version uses the notes fully.
function byNotes(L){
  const w=noteWords();if(!w.length)return L;
  const sc=x=>{const t=(x[0]+" "+x[1]+" "+x[2]).toLowerCase();return w.filter(k=>t.includes(k)).length};
  return L.map((x,i)=>[sc(x),i,x]).sort((p,q)=>q[0]-p[0]||p[1]-q[1]).map(v=>v[2]);
}

// Mood fit for sample ideas. CAPITAL = good fit, lowercase = poor fit.
// S stressed, T tired, R restless, C curious, L lonely, E energetic
const FIT={"Draw your hands":"RC","Blind contour portrait":"RCE","Color mixing chart":"SCr","One-line drawing":"RT",
"Origami crane":"Sre","Paper airplane test flights":"RE","Sticky note doodles":"RTC","Friendship bracelet":"STr","Paper bookmark":"RT","Can pencil holder":"Er",
"Fried rice":"SE","Quesadilla":"TR","Veggie omelet":"TR","Peanut noodles":"TS",
"Mug cake":"RTS","Cookies for two":"SE","Banana muffins":"SEt","Yogurt flatbread":"CE",
"Photo walk":"RCE","Find five new things":"RCS","Sit and sketch":"STr","Cloud watching":"STr",
"Song Maker loop":"RCE","Build a beat":"RE","Melody Maker":"SCT","Listen to a full album":"STr","Mood playlist":"SLC","Try a new genre":"CRE",
"Number guessing game":"CEt","Reverse a string":"RC","Terminal to-do list":"Etr","One practice problem":"RC",
"Random Wikipedia article":"RTC","Five words in a new language":"CRE","How does it work?":"C","Short explainer video":"TC",
"Card game night":"LE","Cook together":"LEt","Two truths and a lie":"LER","Walk and talk":"LRS"};
// Order of the 6 Books/Shows picks by mood (index numbers)
const SO={Tired:[0,1,5],Restless:[1,3,2],Stressed:[0,5,1],Curious:[3,4,2],Lonely:[0,2,5],Energetic:[2,0,3]};
const BO={Tired:[3,2,0],Restless:[2,1,3],Stressed:[3,0,4],Curious:[5,4,2],Lonely:[0,5,4],Energetic:[1,5,0]};
function byMood(L){
  const c={Stressed:"S",Tired:"T",Restless:"R",Curious:"C",Lonely:"L",Energetic:"E"}[a.mood];
  if(!c)return L;
  const sc=x=>{const f=FIT[x[0]]||"";return f.includes(c)?0:f.includes(c.toLowerCase())?2:1};
  const r=L.map((x,i)=>[sc(x),i,x]).sort((p,q)=>p[0]-q[0]||p[1]-q[1]),ok=r.filter(v=>v[0]<2);
  return (ok.length>=3?ok:r).map(v=>v[2]);
}

function items(){
  if(a.niche=="Books/Shows"){
    const L=mine(),o=(a.btype=="Show"?SO:BO)[a.mood]||[];
    return byNotes([...o,...L.keys()].filter((v,i,r)=>r.indexOf(v)==i).map(i=>L[i]));
  }
  const f=a.niche=="Music"?a.mlc:0;
  return byNotes(byMood(D[a.niche].filter(x=>!f||x[3]==f)));
}

// ---------- AI CONNECTION ----------
// Paste your Cloudflare Worker URL below. While it is empty, the app uses the sample ideas.
const API_URL="https://plethora.patil-niti01.workers.dev";
let AI=null,busy=false,seen=[],ERR="";
async function fetchAI(){
  busy=true;ERR="";draw(true);
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answers:Object.fromEntries(Object.entries(a).filter(e=>!e[0].startsWith("more_"))),notes:notes(),seen})});
    if(!r.ok){let d=String(r.status);try{const e=await r.json();d=(e.status||r.status)+" "+(e.detail||e.error||"")}catch(x){}throw new Error(d)}
    const j=await r.json();
    AI=j.items.slice(0,3).map(x=>[String(x.title),String(x.about||""),(x.steps||[]).map(String).join("|"),0,/^https?:\/\//.test(x.link)?x.link:""]);
    seen.push(...AI.map(x=>x[0]));
  }catch(e){AI=null;ERR=String(e&&e.message||e).slice(0,300)}
  busy=false;draw(true);
}

function results(){
  if(busy)return "<h1>Finding ideas…</h1><p class=\"note\">This can take a few seconds.</p>";
  const L=AI||items(),n=L.length;
  let h="<h1>Here are 3 ideas.</h1><p class=\"note\">Based on your answers: "+esc([a.time,a.mood,a.niche].join(", "))+"</p>"+(notes().length?"<p class=\"note\">Your notes: "+esc(notes().map(n=>n.note).join("; "))+"</p>":"")+(API_URL&&!AI?"<p class=\"note\">The AI could not be reached, so these are sample ideas."+(ERR?" ("+esc(ERR)+")":"")+"</p>":"");
  for(let j=0;j<3;j++){
    const x=L[(pg*3+j)%n],saved=S.some(s=>s.t==x[0]);
    h+=`<article><h2>${x[0]}</h2><p>${x[1]}</p><button class="small" data-a="steps">Show steps</button><button class="small" data-a="save" data-t="${esc(x[0])}" data-d="${esc(x[1])}">${saved?"Saved":"Save"}</button><div class="st" hidden><ol>${x[2].split("|").map(s=>"<li>"+s+"</li>").join("")}</ol><p class="note"><a href="${esc(x[4]||LK[x[0]]||gs(x[0]+" tutorial"))}" target="_blank" rel="noopener">Open link</a></p></div></article>`;
  }
  return h+`<button class="main" data-a="again">Run again</button><button class="link" data-a="over">Start over</button><button class="link" data-a="back">Back</button>`;
}

function saved(){
  let h="<h1>Saved</h1>";
  h+=S.length?S.map((s,i)=>`<article><h2>${esc(s.t)}</h2><p>${esc(s.d)}</p><button class="small" data-a="rm" data-i="${i}">Remove</button></article>`).join(""):"<p class=\"note\">Nothing saved yet.</p>";
  return h+`<button class="link" data-a="back">Back</button>`;
}

function draw(keep){
  sv.textContent="Saved ("+S.length+")";
  m.innerHTML=cur==-1?"<h1>Bored? Let’s find something to do.</h1><p class=\"note\">Answer a few quick questions and get 3 ideas that fit.</p><button class=\"main\" data-a=\"start\">Start</button>":cur=="r"?results():cur=="s"?saved():question();
  if(!keep){window.scrollTo(0,0);const i=document.querySelector("#m input");if(i)i.focus()}
}

function choose(v){
  const q=Q[cur];
  a[q.k]=v;
  if(q.k=="niche"&&v=="Surprise me"){a.niche=NICHES[Math.floor(Math.random()*NICHES.length)];a.surprise=1}
  go(nxt(cur));
}

function collect(){document.querySelectorAll("#m [data-k]").forEach(e=>a[e.dataset.k]=e.value.trim())}

function submit(){
  collect();
  const q=Q[cur];
  if(q.f.some(f=>(!f.w||f.w(a))&&!f.opt&&!a[f.k])){document.getElementById("er").textContent="Please answer every question that isn’t marked optional.";return}
  go(nxt(cur));
}

m.onclick=e=>{
  const t=e.target.closest("button");if(!t)return;
  const k=t.dataset.a;
  if(k=="start")go(0);
  else if(k=="back")back();
  else if(k=="again"){if(API_URL)fetchAI();else{pg++;draw()}}
  else if(k=="over"){a={};hist=[];cur=-1;pg=0;draw()}
  else if(k=="opt"){more();choose(t.dataset.v)}
  else if(k=="next")submit();
  else if(k=="steps"){const s=t.closest("article").querySelector(".st");s.hidden=!s.hidden;t.textContent=s.hidden?"Show steps":"Hide steps"}
  else if(k=="save"){
    const i=S.findIndex(s=>s.t==t.dataset.t);
    if(i>=0)S.splice(i,1);else S.push({t:t.dataset.t,d:t.dataset.d});
    put();t.textContent=i>=0?"Save":"Saved";sv.textContent="Saved ("+S.length+")";
  }
  else if(k=="rm"){S.splice(+t.dataset.i,1);put();draw()}
};
sv.onclick=()=>go("s");
m.onchange=e=>{if(e.target.dataset.k=="clevel"){collect();more();draw(true)}};
document.onkeydown=e=>{if(e.key=="Enter"&&document.activeElement.tagName=="INPUT")submit()};
draw();
</script>
</body>
</html>
